[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Syntax, invalid control flow and undefined names across the entire Python backend.
# Broader style cleanup is deliberately limited to operational/refactored modules.
select = ["E9", "F63", "F7", "F82"]
